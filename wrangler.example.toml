# 复制本文件为 wrangler.toml 后填写你的 D1 database_id
# 执行 `npx wrangler d1 create mistral-pool-db` 即可获取 database_id

name = "mistral-pool"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/v1/*", "/admin/*", "/health"]

[[d1_databases]]
binding = "DB"
database_name = "mistral-pool-db"
database_id = "YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# 可选：绑定你托管在 Cloudflare 上的自定义域名
# [[routes]]
# pattern = "mistral.example.com"
# custom_domain = true

[vars]
MISTRAL_BASE_URL = "https://api.mistral.ai"
